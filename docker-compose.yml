version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bff_postgres
    restart: always
    environment:
      POSTGRES_DB: bff_production
      POSTGRES_USER: bff_user
      POSTGRES_PASSWORD: secure_password_here
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bff_backend
    restart: always
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bff_production
      - DB_USERNAME=bff_user
      - DB_PASSWORD=secure_password_here
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bff_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

volumes:
  pgdata:
