version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bff_postgres
    environment:
      POSTGRES_DB: bride_future_foundation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bff_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bff_backend
    restart: always
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bride_future_foundation
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
    depends_on:
      - postgres
    networks:
      - bff_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bff_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - bff_network

  nginx:
    image: nginx:alpine
    container_name: bff_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/html
    depends_on:
      - backend
      - frontend
    networks:
      - bff_network

volumes:
  postgres_data:

networks:
  bff_network:
    driver: bridge
    
